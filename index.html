<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>KLINAYA Mobile — Acid–Base Tutor</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193247;background:#eef4f7}*{box-sizing:border-box}body{margin:0}header{background:#123e5b;color:white;padding:20px max(18px,calc((100vw - 680px)/2));padding-top:max(20px,env(safe-area-inset-top));}h1{font-size:24px;margin:0}header p{margin:5px 0 0;color:#bcd8e7;font-size:13px}main{max-width:680px;margin:auto;padding:18px 16px 100px}.card{background:white;border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 2px 10px #173a5010}.muted{color:#617785;font-size:13px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#3b738f;font-weight:800}.big{font-size:28px;font-weight:800;margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.button{background:#126e90;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:750;cursor:pointer}.button.secondary{background:#e5f0f5;color:#1b5871}.button:disabled{opacity:.5}.choice{display:block;width:100%;background:#f6f9fb;color:#1d3a4a;border:1px solid #dce8ee;text-align:left;padding:13px;margin:8px 0;border-radius:10px;cursor:pointer}.choice.selected{border:2px solid #147c9c;background:#e7f7fb}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#e4f1f5;font-size:12px;color:#225e77;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;border-top:1px solid #d7e5eb;padding-bottom:env(safe-area-inset-bottom);z-index:2}.nav button{flex:1;max-width:140px;background:none;border:0;padding:13px 2px;color:#597382;font-size:12px;cursor:pointer}.nav button.active{color:#006f96;font-weight:900}.bar{background:#e6eff2;border-radius:10px;height:10px;overflow:hidden}.fill{background:#1383a0;height:100%}.good{color:#14784c}.bad{color:#a23f32}.divider{border:0;border-top:1px solid #e5edf1;margin:14px 0}input[type=number]{width:100%;border:1px solid #c9dce5;padding:10px;border-radius:8px;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.small{font-size:12px}details{margin:10px 0;background:#f3f8fa;border-radius:9px;padding:10px}summary{cursor:pointer;font-weight:700}.feedback{border-left:4px solid #1584a0;background:#f0f8fb;padding:13px;border-radius:8px;margin-top:14px}button:focus-visible{outline:3px solid orange}footer{font-size:12px;color:#687d89;text-align:center;margin:22px 0}</style></head><body><header><h1>✦ KLINAYA</h1><p>Your personalized medical learning companion · Acid–Base v0.1</p></header><main id="app"></main><nav class="nav" aria-label="Main navigation"><button data-tab="today">⌂<br>Today</button><button data-tab="learn">▤<br>Learn</button><button data-tab="practice">◉<br>Practice</button><button data-tab="tools">∑<br>Tools</button><button data-tab="progress">▥<br>Progress</button></nav><script>
'use strict';
const items=[
{id:'AB001',skill:'Basics',level:1,q:'An arterial blood gas shows pH 7.28, PaCO₂ 25 mmHg, and HCO₃⁻ 12 mEq/L. What is the primary disorder?',a:['Respiratory acidosis','Metabolic acidosis','Metabolic alkalosis','Respiratory alkalosis'],correct:1,why:'Acidemia with reduced bicarbonate indicates primary metabolic acidosis. Low PaCO₂ is consistent with respiratory compensation.',hint:'First identify acidemia versus alkalemia, then determine which variable explains the pH.',trap:'Do not label the low PaCO₂ as the primary process simply because it is abnormal.'},
{id:'AB002',skill:'Basics',level:1,q:'pH 7.51, PaCO₂ 29 mmHg, HCO₃⁻ 23 mEq/L. Which primary process best explains the pH?',a:['Respiratory alkalosis','Metabolic alkalosis','Respiratory acidosis','Metabolic acidosis'],correct:0,why:'Alkalemia with low PaCO₂ points to primary respiratory alkalosis.',hint:'Which change lowers hydrogen ion concentration?',trap:'Near-normal bicarbonate does not exclude an acute respiratory disorder.'},
{id:'AB003',skill:'Anion gap',level:2,q:'Na⁺ 140, Cl⁻ 104, HCO₃⁻ 12 mEq/L. What is the anion gap (without potassium)?',a:['12','18','24','36'],correct:2,why:'Anion gap = Na − (Cl + HCO₃) = 140 − (104 + 12) = 24 mEq/L.',hint:'Use sodium minus the sum of chloride and bicarbonate.',trap:'The anion gap should be interpreted in the context of albumin.'},
{id:'AB004',skill:'Anion gap',level:2,q:'A patient has an anion gap of 16 mEq/L and albumin 2 g/dL. Approximately what is the albumin-corrected anion gap?',a:['11','16','21','26'],correct:2,why:'Corrected AG ≈ observed AG + 2.5 × (4 − albumin in g/dL) = 16 + 5 = 21 mEq/L.',hint:'Low albumin can mask an elevated anion gap. Add about 2.5 for each 1 g/dL below 4.',trap:'A normal-appearing uncorrected gap may conceal high-gap acidosis.'},
{id:'AB005',skill:'Compensation',level:3,q:'In metabolic acidosis with HCO₃⁻ 12 mEq/L, what PaCO₂ is predicted by Winter’s formula?',a:['12 ± 2','26 ± 2','36 ± 2','48 ± 2'],correct:1,why:'Winter’s formula: expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2 = 26 ± 2 mmHg.',hint:'Expected PaCO₂ = 1.5 × bicarbonate + 8 (± 2).',trap:'A PaCO₂ outside the expected range suggests an additional respiratory disorder.'},
{id:'AB006',skill:'Compensation',level:3,q:'Metabolic acidosis: HCO₃⁻ 10 mEq/L, measured PaCO₂ 35 mmHg. Which interpretation is most appropriate?',a:['Appropriate respiratory compensation','Additional respiratory acidosis','Additional respiratory alkalosis','Isolated respiratory alkalosis'],correct:1,why:'Winter’s expected PaCO₂ is 23 ± 2 mmHg. Measured 35 is too high, indicating superimposed respiratory acidosis.',hint:'Calculate the expected PaCO₂ before comparing it with the measured value.',trap:'Do not assume every decrease in PaCO₂ constitutes adequate compensation.'},
{id:'AB007',skill:'Mixed disorders',level:4,q:'A patient with vomiting and diabetic ketoacidosis has Na⁺ 138, Cl⁻ 92, HCO₃⁻ 18 mEq/L (assume normal AG 12). What does delta-gap analysis suggest?',a:['Pure normal-gap acidosis','Additional metabolic alkalosis','Additional respiratory acidosis','No acid–base disturbance'],correct:1,why:'AG = 28; ΔAG = 16 and ΔHCO₃ = 6 (24−18). A much larger rise in gap than fall in bicarbonate suggests concurrent metabolic alkalosis.',hint:'Compare increase in anion gap above 12 with decrease in bicarbonate below 24.',trap:'Delta analysis is a clue, not a substitute for the clinical picture and albumin adjustment.'},
{id:'AB008',skill:'Mixed disorders',level:4,q:'pH 7.40, PaCO₂ 20 mmHg, HCO₃⁻ 12 mEq/L. Which statement is most accurate?',a:['Normal acid–base status because pH is normal','Metabolic acidosis plus respiratory alkalosis is possible','Pure metabolic alkalosis','Pure respiratory acidosis'],correct:1,why:'Winter’s expected PaCO₂ for HCO₃ 12 is 26 ± 2; measured 20 is lower, supporting an additional respiratory alkalosis. A near-normal pH does not exclude mixed disorders.',hint:'Check whether measured PaCO₂ matches Winter’s prediction.',trap:'Normal pH can occur when opposing primary disturbances coexist.'},
{id:'AB009',skill:'Clinical cases',level:5,q:'A patient with severe diarrhea has pH 7.29, HCO₃⁻ 15, Na⁺ 139, Cl⁻ 113. Which mechanism best explains the metabolic acidosis?',a:['Loss of bicarbonate through the GI tract','Accumulation of ketoacids','Chronic CO₂ retention','Excessive gastric acid loss'],correct:0,why:'The anion gap is 11 mEq/L, consistent with normal-gap metabolic acidosis due to GI bicarbonate loss.',hint:'Calculate the anion gap and consider what diarrhea removes.',trap:'Diarrhea and vomiting often produce different acid–base patterns.'},
{id:'AB010',skill:'Clinical cases',level:5,q:'A patient with suspected toxic alcohol ingestion has severe high-anion-gap metabolic acidosis. Which action is most appropriate?',a:['Delay assessment until repeat outpatient labs','Urgent emergency evaluation and toxicology-directed management','Treat with oral bicarbonate alone at home','Assume compensation rules out toxicity'],correct:1,why:'Suspected toxic alcohol poisoning is a medical emergency requiring immediate expert-guided assessment and treatment; acid–base analysis supports but does not replace urgent care.',hint:'Is this a time-sensitive potentially life-threatening diagnosis?',trap:'An educational tutor must not turn this scenario into unsupervised treatment advice.'},
{id:'AB011',skill:'Respiratory disorders',level:3,q:'A patient develops acute hypoventilation with PaCO₂ rising from 40 to 60 mmHg. Approximately how much should HCO₃⁻ rise from 24 mEq/L with acute respiratory acidosis?',a:['About 2 mEq/L','About 8 mEq/L','About 12 mEq/L','About 20 mEq/L'],correct:0,why:'In acute respiratory acidosis, HCO₃⁻ rises roughly 1 mEq/L per 10 mmHg PaCO₂ increase; a 20-mmHg increase predicts about 2 mEq/L.',hint:'Acute respiratory acidosis: bicarbonate rises about 1 per 10 increase in CO₂.',trap:'Chronic renal compensation is larger than acute buffering.'},
{id:'AB012',skill:'Respiratory disorders',level:3,q:'Chronic respiratory acidosis raises PaCO₂ from 40 to 60 mmHg. What approximate HCO₃⁻ would be expected from a baseline of 24?',a:['20','26','31–32','44'],correct:2,why:'Chronic respiratory acidosis raises HCO₃⁻ about 3.5–4 mEq/L per 10 mmHg increase in PaCO₂, giving approximately 31–32.',hint:'Chronic compensation is approximately 3.5–4 bicarbonate units per 10 CO₂.',trap:'Acute and chronic compensation rules differ.'},
{id:'AB013',skill:'Metabolic alkalosis',level:3,q:'A patient with prolonged vomiting has pH 7.52, HCO₃⁻ 36 mEq/L and low urine chloride. Which process is most likely?',a:['Chloride-responsive metabolic alkalosis','High-gap metabolic acidosis','Respiratory alkalosis','Chloride-resistant alkalosis from mineralocorticoid excess'],correct:0,why:'Vomiting produces gastric hydrogen and chloride loss; low urine chloride often supports chloride-responsive metabolic alkalosis.',hint:'Consider the role of chloride depletion after gastric losses.',trap:'Urine chloride interpretation depends on timing of diuretic exposure and renal function.'},
{id:'AB014',skill:'Anion gap',level:2,q:'Na⁺ 136, Cl⁻ 100, HCO₃⁻ 24 mEq/L. What is the anion gap?',a:['8','12','16','24'],correct:1,why:'AG = 136 − (100 + 24) = 12 mEq/L.',hint:'Subtract chloride plus bicarbonate from sodium.',trap:'Reference intervals vary by laboratory and assay.'},
{id:'AB015',skill:'Compensation',level:4,q:'pH 7.18, HCO₃⁻ 8, PaCO₂ 18 mmHg. Is the PaCO₂ appropriate for metabolic acidosis?',a:['Yes, expected is 20 ± 2','No, additional respiratory acidosis','No, additional respiratory alkalosis','Cannot calculate expected compensation'],correct:0,why:'Winter’s formula gives 1.5×8 + 8 = 20 ± 2 mmHg; measured 18 is at the lower boundary of the expected range.',hint:'Compute 1.5 × 8 + 8 and include the ±2 range.',trap:'Borderline values need clinical context and measurement uncertainty.'},
{id:'AB016',skill:'Clinical cases',level:5,q:'An ill patient has pH 7.12, HCO₃⁻ 7, lactate 9 mmol/L, and hypotension. Which interpretation is best?',a:['Severe lactic metabolic acidosis requiring urgent evaluation of shock','Compensated chronic respiratory alkalosis','Isolated metabolic alkalosis','Normal finding after exercise'],correct:0,why:'Severe acidemia, low bicarbonate, markedly elevated lactate, and hypotension support life-threatening lactic acidosis associated with shock. Immediate clinical evaluation is essential.',hint:'Connect the lactate and perfusion findings with the acid–base pattern.',trap:'The tutor is educational; management requires supervised emergency care.'}
];
const skills=[...new Set(items.map(x=>x.skill))];const KEY='klinarya_acidbase_v01';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(!state||!state.attempts)state={attempts:[],prefs:{notifications:false},tab:'today'};let tab='today',current=null,selected=null,answered=false,hintShown=false,mode='adaptive',filter='all';const el=document.getElementById('app');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const recent=id=>state.attempts.filter(a=>a.id===id).sort((a,b)=>b.at-a.at)[0];const due=id=>{let r=recent(id);return !r||r.due<=Date.now()};const stats=()=>({done:new Set(state.attempts.map(x=>x.id)).size,correct:state.attempts.filter(x=>x.correct).length,total:state.attempts.length,due:items.filter(x=>due(x.id)).length});const header=(k,t,s)=>`<div class="card"><div class="kicker">${k}</div><h2>${t}</h2><p class="muted">${s}</p></div>`;
function today(){let s=stats();return `<div class="card"><div class="kicker">Personal learning plan</div><div class="big">${s.due} reviews ready</div><p class="muted">Review concepts before they fade. New questions are also included in this count.</p><button class="button" data-action="start">Start adaptive session</button></div><div class="grid"><div class="card"><div class="big">${s.done}/${items.length}</div><div class="muted">Cases attempted</div></div><div class="card"><div class="big">${s.total?Math.round(100*s.correct/s.total)+'%':'—'}</div><div class="muted">Practice accuracy</div></div></div><div class="card"><h3>Your next focus</h3><p>${esc(weakest())}</p><p class="muted">Scheduled reviews use an introductory interval heuristic. FSRS calibration is a future integration.</p><button class="button secondary" data-tab="learn">Explore learning modules</button></div><div class="card"><h3>Daily review reminders</h3><p class="muted">This offline prototype cannot deliver reliable scheduled background push notifications. A production app needs permission-based notifications and a service worker or native scheduler.</p><button class="button secondary" data-action="remind">${state.prefs.notifications?'Reminder preference saved':'Enable reminder preference'}</button></div>`}
function weakest(){let ranks=skills.map(skill=>{let a=state.attempts.filter(x=>items.find(i=>i.id===x.id)?.skill===skill);return {skill,score:a.length?a.filter(x=>x.correct).length/a.length:0,seen:a.length}}).sort((a,b)=>a.score-b.score||a.seen-b.seen);return ranks[0]?.skill||'Basics'}
function learn(){let content=[['Basics','pH < 7.35 suggests acidemia; pH > 7.45 suggests alkalemia. Interpret pH with PaCO₂ and bicarbonate.'],['Anion gap','AG = Na − (Cl + HCO₃). Correct for hypoalbuminemia: AGcorrected ≈ AG + 2.5 × (4 − albumin [g/dL]).'],['Compensation','Metabolic acidosis: Winter’s formula predicts PaCO₂ = 1.5 × HCO₃ + 8 ± 2. Compare measured and expected PaCO₂.'],['Mixed disorders','A near-normal pH does not rule out multiple primary disorders. Compare compensation and evaluate the delta gap when appropriate.'],['Clinical cases','Interpret the blood gas in the clinical context, considering renal function, glucose, lactate, ketones, toxins, perfusion, and GI losses.'],['Respiratory disorders','Acute respiratory acidosis: HCO₃ rises ~1 per 10-mmHg PaCO₂ increase; chronic: ~3.5–4 per 10.'],['Metabolic alkalosis','Consider chloride depletion, vomiting, diuretics, mineralocorticoid states, and urine chloride with clinical context.']];return header('Guided curriculum','Acid–base disorders','Seven linked competencies · 16 synthetic practice questions')+content.map(([k,v])=>`<div class="card"><div class="row"><h3>${k}</h3><span class="pill">${items.filter(x=>x.skill===k).length} cases</span></div><p>${v}</p><button class="button secondary" data-skill="${k}">Practice this topic</button></div>`).join('')}
function choose(){let pool=items.filter(x=>filter==='all'||x.skill===filter);let dueItems=pool.filter(x=>due(x.id));let p=[...(dueItems.length?dueItems:pool)];let weakness=weakest();p.sort((a,b)=>{let ar=recent(a.id),br=recent(b.id);let as=(a.skill===weakness?-2:0)+(ar?ar.due/1e12: -4),bs=(b.skill===weakness?-2:0)+(br?br.due/1e12:-4);return as-bs});return p[0]||items[0]}
function practice(){if(!current)current=choose();let q=current;let html=`<div class="card"><div class="row"><span class="pill">${q.skill}</span><span class="muted">Level ${q.level}/5 · ${q.id}</span></div><h2>${esc(q.q)}</h2><p class="muted">Commit to your answer before seeing the explanation.</p>${q.a.map((a,i)=>`<button class="choice ${selected===i?'selected':''}" data-answer="${i}" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}<div class="row"><button class="button secondary" data-action="hint" ${answered?'disabled':''}>Socratic hint</button><button class="button" data-action="check" ${selected===null||answered?'disabled':''}>Check answer</button></div>${hintShown&&!answered?`<div class="feedback"><b>Think about this:</b> ${esc(q.hint)}</div>`:''}${answered?`<div class="feedback"><strong class="${selected===q.correct?'good':'bad'}">${selected===q.correct?'Correct':'Not yet correct'}</strong><p>${esc(q.why)}</p><p><b>Common misconception:</b> ${esc(q.trap)}</p><p class="muted">How difficult was recalling and applying this concept?</p><div class="grid">${['Again','Hard','Good','Easy'].map(r=>`<button class="button secondary" data-rate="${r}">${r}</button>`).join('')}</div></div>`:''}</div>`;return html}
function tools(){return header('Clinical calculations','Acid–base tools','Educational calculator; not a clinical decision-support device.')+`<div class="card"><div class="grid"><div><label for="ph">pH</label><input id="ph" type="number" step="0.01" value="7.25"></div><div><label for="pco2">PaCO₂ (mmHg)</label><input id="pco2" type="number" step="1" value="25"></div><div><label for="hco3">HCO₃ (mEq/L)</label><input id="hco3" type="number" step="1" value="11"></div><div><label for="na">Na (mEq/L)</label><input id="na" type="number" step="1" value="140"></div><div><label for="cl">Cl (mEq/L)</label><input id="cl" type="number" step="1" value="104"></div><div><label for="alb">Albumin (g/dL)</label><input id="alb" type="number" step="0.1" value="4"></div></div><p><button class="button" data-action="calc">Calculate & explain</button></p><div id="calc-result" aria-live="polite"></div></div>`}
function calc(){let v=id=>{let raw=document.getElementById(id).value.trim();return raw===''?NaN:Number(raw)},p=v('ph'),c=v('pco2'),h=v('hco3'),n=v('na'),cl=v('cl'),al=v('alb');let target=document.getElementById('calc-result');if([p,c,h,n,cl,al].some(x=>!Number.isFinite(x))||p<6.5||p>8||c<=0||h<=0||al<0||al>7||n<50||n>200||cl<20||cl>180){target.textContent='Please enter plausible numeric values.';return}let ag=n-cl-h,corrected=ag+2.5*(4-al),win=1.5*h+8,pattern=p<7.35?'Acidemia':p>7.45?'Alkalemia':'Near-normal pH';let comp=(p<7.35&&h<22)?`For suspected metabolic acidosis, Winter’s expected PaCO₂ is ${win.toFixed(1)} ± 2 mmHg; measured PaCO₂ is ${c}. ${c>win+2?'Possible additional respiratory acidosis.':c<win-2?'Possible additional respiratory alkalosis.':'Measured PaCO₂ is within the expected compensation range.'}`:'Winter’s formula applies to metabolic acidosis; determine the primary process before using it.';target.innerHTML=`<div class="feedback"><b>${pattern}</b><p>Anion gap: <b>${ag.toFixed(1)}</b> mEq/L</p><p>Albumin-corrected AG: <b>${corrected.toFixed(1)}</b> mEq/L</p><p>${esc(comp)}</p><small>These are approximations. Reference ranges, sampling errors, albumin and clinical context matter.</small></div>`}
function progress(){let s=stats();return header('Learning analytics','Your progress','Practice data are local to this browser and are not validated mastery estimates.')+`<div class="card"><div class="grid"><div><div class="big">${s.total}</div><div class="muted">Attempts</div></div><div><div class="big">${s.done}</div><div class="muted">Distinct cases</div></div></div><hr class="divider">${skills.map(sk=>{let a=state.attempts.filter(x=>items.find(i=>i.id===x.id)?.skill===sk),pct=a.length?Math.round(100*a.filter(x=>x.correct).length/a.length):0;return `<div style="margin:13px 0"><div class="row"><b>${sk}</b><span class="muted">${a.length?a.length+' attempts · '+pct+'%':'Not yet practiced'}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`}).join('')}<p class="muted">Practice accuracy is not a measure of independent retention. The pilot will include unseen, unaided transfer cases at 30 days.</p><button class="button secondary" data-action="export">Export learning history (JSON)</button></div><div class="card"><h3>Privacy controls</h3><p class="muted">Progress is saved on this device in browser storage. Clearing site data removes it. No student data are sent to a server in this prototype.</p><button class="button secondary" data-action="reset">Clear local progress</button></div>`}
function render(){el.innerHTML=({today,learn,practice,tools,progress}[tab]||today)();document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));save()}
function next(){current=null;selected=null;answered=false;hintShown=false;tab='practice';render()}
function record(rate){let prev=recent(current.id),prevInterval=prev?.interval||0;let interval=rate==='Again'?1:rate==='Hard'?Math.max(1,Math.round(prevInterval*1.2)||2):rate==='Good'?Math.max(2,Math.round(prevInterval*2.1)||3):Math.max(4,Math.round(prevInterval*2.8)||5);if(selected!==current.correct)interval=1;state.attempts.push({id:current.id,at:Date.now(),correct:selected===current.correct,choice:selected,rate,interval,due:Date.now()+interval*86400000,hint:hintShown});save();next()}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}if(t.dataset.skill){filter=t.dataset.skill;next();return}if(t.dataset.answer!==undefined&&!answered){selected=Number(t.dataset.answer);render();return}if(t.dataset.rate){record(t.dataset.rate);return}switch(t.dataset.action){case 'start':filter='all';next();break;case 'hint':hintShown=true;render();break;case 'check':if(selected!==null){answered=true;render()}break;case 'calc':calc();break;case 'remind':state.prefs.notifications=!state.prefs.notifications;render();break;case 'reset':if(confirm('Delete all locally saved practice history?')){state.attempts=[];next()}break;case 'export':{let blob=new Blob([JSON.stringify({version:'0.1',exported:new Date().toISOString(),attempts:state.attempts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='klinarya-learning-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}}});render();if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
